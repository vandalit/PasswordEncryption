<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Encoder/Decoder</title>
    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-KyZXEAg3QhqLMpG8r+Knujsl5/5hb7xv8pGkkrhzx8nE6S5c5G22k78VMBspk4w"
        crossorigin="anonymous"
    >
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }
        h1 {
            color: #00ffcc;
        }
        .card {
            background-color: #1e1e1e;
            border: none;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.8);
        }
        .btn-custom {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            transition: 0.3s ease-in-out;
        }
        .btn-custom:hover {
            background-color: #00e0b3;
        }
        textarea, input {
            background-color: #2e2e2e;
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 5px;
        }
        .result {
            background-color: #1e1e1e;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Password Encoder/Decoder</h1>
        <div class="card mx-auto" style="max-width: 600px;">
            <div class="card-body">
                <label for="action" class="form-label">Choose an action:</label>
                <select id="action" class="form-select mb-3">
                    <option value="encode">Encode</option>
                    <option value="decode">Decode</option>
                </select>
                <label for="inputText" class="form-label">Enter your password or Base64 text:</label>
                <textarea id="inputText" class="form-control mb-3" rows="4" placeholder="Type here..."></textarea>
                <label for="key" class="form-label">Key:</label>
                <input id="key" type="text" class="form-control mb-3" placeholder="Enter key (optional)">
                <button class="btn btn-custom w-100" onclick="processText()">Run</button>
                <div class="result mt-3" id="output">Your result will appear here...</div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoA6lpT7rHRN22+3DR4eLrZB8cEgxlj3BXUAMrtw1WE6yIw"
        crossorigin="anonymous"></script>

    <script>
        // Vigenère Cipher Functions
        function vigenereEncrypt(text, key) {
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
            const keyRepeats = key.repeat(Math.ceil(text.length / key.length)).slice(0, text.length);
            return Array.from(text).map((char, i) => {
                const textIndex = alphabet.indexOf(char);
                const keyIndex = alphabet.indexOf(keyRepeats[i]);
                if (textIndex === -1) return char; // Non-alphabet character
                const newIndex = (textIndex + keyIndex) % alphabet.length;
                return alphabet[newIndex];
            }).join('');
        }

        function vigenereDecrypt(text, key) {
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
            const keyRepeats = key.repeat(Math.ceil(text.length / key.length)).slice(0, text.length);
            return Array.from(text).map((char, i) => {
                const textIndex = alphabet.indexOf(char);
                const keyIndex = alphabet.indexOf(keyRepeats[i]);
                if (textIndex === -1) return char; // Non-alphabet character
                const newIndex = (textIndex - keyIndex + alphabet.length) % alphabet.length;
                return alphabet[newIndex];
            }).join('');
        }

        // Base64 and Clipboard Handling
        function processText() {
            const action = document.getElementById("action").value;
            const input = document.getElementById("inputText").value.trim();
            const key = document.getElementById("key").value.trim();
            const outputElement = document.getElementById("output");

            try {
                let result = '';
                if (action === "encode") {
                    result = btoa(input);
                    if (key) result = vigenereEncrypt(result, key);
                } else if (action === "decode") {
                    result = key ? vigenereDecrypt(input, key) : input;
                    result = atob(result);
                } else {
                    outputElement.textContent = "Invalid action!";
                    return;
                }
                outputElement.textContent = result;
                navigator.clipboard.writeText(result); // Copy to clipboard
                alert("Result copied to clipboard!");
            } catch (error) {
                outputElement.textContent = `Error: ${error.message}`;
            }
        }

        // Trigger "Run" on Enter
        document.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                event.preventDefault();
                processText();
            }
        });
    </script>
</body>
</html>
