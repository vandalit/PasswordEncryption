<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Encoder/Decoder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 600px;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin: 10px 0;
        }
        button {
            margin: 5px 0;
            padding: 10px 20px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #f4f4f4;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>Password Encoder/Decoder</h1>
    <label for="action">Choose an action:</label>
    <select id="action">
        <option value="encode">Encode</option>
        <option value="decode">Decode</option>
    </select>
    <textarea id="inputText" placeholder="Enter your password or Base64-encoded text here..."></textarea>
    <button onclick="processText()">Run</button>
    <div class="result" id="output">Your result will appear here...</div>

    <script>
        function processText() {
            const action = document.getElementById("action").value;
            const input = document.getElementById("inputText").value.trim();
            const outputElement = document.getElementById("output");

            try {
                if (action === "encode") {
                    const encoded = btoa(input);
                    outputElement.textContent = `Encoded: ${encoded}`;
                } else if (action === "decode") {
                    const decoded = atob(input);
                    outputElement.textContent = `Decoded: ${decoded}`;
                } else {
                    outputElement.textContent = "Invalid action!";
                }
            } catch (error) {
                outputElement.textContent = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
